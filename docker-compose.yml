services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      RAPID_LEARN_DATABASE_URL: sqlite:////app/data/rapid_learn.db
      RAPID_LEARN_CORS_ORIGINS: http://localhost:5173
    volumes:
      - rapid-learn-data:/app/data
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  rapid-learn-data:

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rapid-learn"
version = "0.1.0"
description = "Resource-Aware, Personalised and Intelligent Dynamic Learning Framework"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "networkx>=3.3,<4.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0", "pytest>=8.3,<9.0", "pytest-cov>=6.0,<7.0", "ruff>=0.8,<1.0"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI uses Depends()/Query() as declarative defaults.
